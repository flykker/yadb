[workspace]
resolver = "2"
members = [
  "crates/yadb-io",
  "crates/yadb-blob",
  "crates/yadb-control",
  "crates/yadbctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
crc32fast = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
