[workspace]
resolver = "2"
members = [
  "crates/yadb-io",
  "crates/yadb-blob",
  "crates/yadb-control",
  "crates/yadb-metakv",
  "crates/yadb-s3",
  "crates/yadb-db",
  "crates/yadb-block",
  "crates/yadbd",
  "crates/yadbctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
crc32fast = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
bytes = "1.12"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
openraft = { version = "0.9.25", default-features = false, features = ["serde", "storage-v2", "generic-snapshot-data"] }
axum = "0.8"
