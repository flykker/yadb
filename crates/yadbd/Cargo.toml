[package]
name = "yadbd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "yadbd"
path = "src/main.rs"

[features]
experimental-openraft-storage = ["yadb-metakv/experimental-openraft-storage", "dep:openraft", "dep:tokio-rustls"]

[dependencies]
yadb-io = { path = "../yadb-io" }
yadb-blob = { path = "../yadb-blob" }
yadb-control = { path = "../yadb-control" }
yadb-metakv = { path = "../yadb-metakv" }
yadb-s3 = { path = "../yadb-s3" }
yadb-db = { path = "../yadb-db" }
yadb-block = { path = "../yadb-block" }
openraft = { workspace = true, optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"], optional = true }
axum.workspace = true
bytes.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ring = "0.17.14"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
base64 = "0.22.1"
crc32fast.workspace = true
