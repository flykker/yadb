[package]
name = "yadbd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "yadbd"
path = "src/main.rs"

[features]
# Retained as a no-op so existing `--features openraft-storage` invocations
# keep working; OpenRaft is the only metadata runtime and is always compiled in.
openraft-storage = []

[dependencies]
yadb-io = { path = "../yadb-io" }
yadb-blob = { path = "../yadb-blob" }
yadb-control = { path = "../yadb-control" }
yadb-metakv = { path = "../yadb-metakv" }
yadb-s3 = { path = "../yadb-s3" }
yadb-db = { path = "../yadb-db" }
yadb-block = { path = "../yadb-block" }
openraft.workspace = true
# Blocking TLS for the opt-in pgwire listener; also used by the OpenRaft peer
# transport, which is why it is not optional.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
axum.workspace = true
bytes.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ring = "0.17.14"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Opt-in, `RUST_LOG`-gated subscriber. OpenRaft reports replication failures
# through `tracing`, and without a subscriber they are discarded: that is why a
# stalled commit left no daemon-side trace at all. It is off unless `RUST_LOG`
# is set, so the default path is unchanged.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
base64 = "0.22.1"
crc32fast.workspace = true
