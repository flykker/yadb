[package]
name = "yadb-metakv"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Retained as a no-op so downstream `--features openraft-storage` invocations
# keep working; the OpenRaft adapters are always compiled in now.
openraft-storage = []

[dependencies]
yadb-io = { path = "../yadb-io" }
crc32fast.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
openraft.workspace = true
ring.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tokio.workspace = true
ring.workspace = true
tracing.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
